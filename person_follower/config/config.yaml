person_follower:
  ros__parameters:
    # ROS topics from robomaster_ros.
    camera_topic: "/camera/image_color"
    cmd_vel_topic: "/cmd_vel"

    # YOLO11 configuration.
    yolo_model: "yolo11n.pt"
    confidence_threshold: 0.45
    imgsz: 640
    person_class_id: 0

    # Person follow control configuration.
    control_rate_hz: 15.0
    center_threshold_px: 45
    yaw_gain: 1.2
    distance_gain: 0.8
    max_linear_speed: 0.30
    min_linear_speed: 0.06
    max_angular_speed: 1.0
    min_angular_speed: 0.10

    # Distance is estimated from bbox height ratio, not real meters.
    target_distance_m: 1.5
    target_bbox_height_ratio: 0.45
    bbox_height_tolerance: 0.08

    # Safety.
    lost_target_timeout_sec: 0.8
    command_timeout_sec: 0.5
    image_timeout_sec: 1.0
    enable_backward: true
    enable_auto_move: true

    # MediaPipe Hands gesture recognition.
    gesture:
      enabled: true
      max_num_hands: 2
      min_detection_confidence: 0.6
      min_tracking_confidence: 0.5
      stable_frame_count: 5
      cooldown_seconds: 2.0
      turn_angular_speed: 0.6
      action_duration_sec: 1.0
      publish_debug_image: false

    # Gesture to command mapping.
    gesture_actions:
      open_palm: "STOP"
      thumbs_up: "START_FOLLOW"
      fist: "PAUSE"
      point_left: "TURN_LEFT"
      point_right: "TURN_RIGHT"
      victory: "PATROL_READY"
      ok_sign: "RESUME"

    # Control modes.
    control_modes:
      default_mode: "IDLE"
      follow_mode_enabled: true
      emergency_stop_enabled: true

    # OpenAI-compatible Llama Server for text planning.
    llm:
      enabled: true
      base_url: "http://127.0.0.1:8080/v1"
      model: "qwen3"
      timeout_sec: 8.0

    # OpenAI-compatible vision-language model, for example Qwen3-VL.
    vlm:
      enabled: true
      base_url: "http://127.0.0.1:8080/v1"
      model: "qwen3-vl"
      timeout_sec: 8.0

    # Vision-Language-Agent planning loop.
    agent:
      enabled: true
      max_history: 20
      planning_interval: 2.0
      forward_speed: 0.12
      turn_speed: 0.45
      action_duration_sec: 0.8

    # Flask dashboard.
    dashboard_enabled: true
    dashboard_host: "0.0.0.0"
    dashboard_port: 8088
    jpeg_quality: 80
