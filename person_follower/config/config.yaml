person_follower:
  ros__parameters:
    # ROS topics from robomaster_ros.
    camera_topic: "/camera/image_color"
    cmd_vel_topic: "/cmd_vel"
    cmd_gimbal_topic: "/cmd_gimbal"
    robot_mode_topic: "/robot/mode"
    robot_command_topic: "/robot/command"
    led_command_topic: "/robot/led_command"
    robot_ip: "10.10.10.152"

    # YOLO11 configuration.
    yolo_model: "yolo11n.pt"
    confidence_threshold: 0.45
    imgsz: 640
    person_class_id: 0

    # Person follow control configuration.
    control_rate_hz: 15.0
    center_threshold_px: 45
    chassis_move_center_ratio: 0.20
    yaw_gain: 1.2
    distance_gain: 1.1
    max_linear_speed: 0.35
    min_linear_speed: 0.07
    max_angular_speed: 1.0
    min_angular_speed: 0.10

    # Distance is estimated from bbox height ratio, not real meters.
    # target_bbox_height_ratio ~ 0.6 means person is about 1 meter away
    target_distance_m: 1.0
    target_bbox_height_ratio: 0.60
    bbox_height_tolerance: 0.04
    enable_chassis_yaw_assist: false

    # Safety.
    lost_target_timeout_sec: 3.0
    command_timeout_sec: 5.0
    image_timeout_sec: 5.0
    enable_backward: true
    enable_auto_move: true

    # Gimbal auto-tracking parameters (slower and more stable tracking)
    gimbal_target_y_ratio: 0.38    # Track upper torso to keep the head in frame
    gimbal_frame_center_y_ratio: 0.42  # Keep target slightly above frame center
    gimbal_yaw_gain: 3.2           # Higher gain for faster yaw response
    gimbal_pitch_gain: 1.0         # Lower pitch gain to reduce vertical hunting
    max_gimbal_yaw_speed: 3.0      # Maximum yaw speed (rad/s)
    max_gimbal_pitch_speed: 1.0    # Maximum pitch speed (rad/s)
    min_gimbal_speed: 0.05         # Minimum gimbal speed to overcome friction
    gimbal_deadzone_px: 8          # Small deadzone for responsive tracking
    gimbal_vertical_deadzone_px: 18 # Larger vertical deadzone to reduce oscillation

    # Locked-target follow control tuning.
    follow_control:
      enabled: true
      require_locked_target: true
      yolo_class_person: 0
      iou_match_threshold: 0.25
      center_distance_threshold_ratio: 0.18
      max_area_change_ratio: 2.5
      target_lost_timeout: 1.0
      center_dead_zone_ratio: 0.08
      too_far_height_ratio: 0.28
      too_close_height_ratio: 0.66
      max_linear_x: 0.10
      max_angular_z: 0.30
      max_gimbal_yaw_speed: 0.25
      kp_chassis_yaw: 0.25
      kp_gimbal_yaw: 0.20
      chassis_yaw_invert: false
      gimbal_yaw_invert: false
      smooth_alpha: 0.3
      control_rate_hz: 10.0
      gimbal_first: true
      chassis_rotate_delay_seconds: 0.5
      debug_follow_only: false
      enable_gimbal_control: true
      enable_chassis_rotation: true
      enable_distance_control: true

    # MediaPipe Hands gesture recognition.
    gesture:
      enabled: true
      max_num_hands: 2
      min_detection_confidence: 0.6
      min_tracking_confidence: 0.5
      stable_frame_count: 5
      cooldown_seconds: 2.0
      turn_angular_speed: 0.6
      action_duration_sec: 1.0
      publish_debug_image: false

    # Gesture to command mapping.
    gesture_actions:
      open_palm: "STOP"
      thumbs_up: "START_FOLLOW"
      fist: "PAUSE"
      point_left: "TURN_LEFT"
      point_right: "TURN_RIGHT"
      victory: "PATROL_READY"
      ok_sign: "RESUME"

    # Control modes.
    control_modes:
      default_mode: "IDLE"
      follow_mode_enabled: true
      emergency_stop_enabled: true

    # OpenAI-compatible Llama Server for text planning.
    llm:
      enabled: true
      base_url: "http://10.10.10.156:8080/v1"
      model: "Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q2_K_P.gguf"
      timeout_sec: 8.0

    # OpenAI-compatible vision-language model, for example Qwen3-VL.
    vlm:
      enabled: true
      base_url: "http://10.10.10.156:8080/v1"
      model: "qwen3-vl"
      timeout_sec: 8.0

    # Vision-Language-Agent planning loop.
    agent:
      enabled: true
      max_history: 20
      planning_interval: 2.0
      forward_speed: 0.12
      turn_speed: 0.45
      action_duration_sec: 0.8

    # Flask dashboard.
    dashboard_enabled: true
    dashboard_host: "0.0.0.0"
    dashboard_port: 8088
    jpeg_quality: 80
