<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboMaster 媒体管理</title>
  <meta name="dashboard-version" content="{{ dashboard_version }}">
  <link rel="stylesheet" href="/static/css/dashboard.css?v={{ dashboard_version }}">
</head>
<body class="media-page">
  <div class="noise"></div>
  <div class="scanline"></div>

  <header class="topbar">
    <div class="brand-block">
      <div class="brand-kicker">战术机器人指挥中心</div>
      <h1>RoboMaster 媒体管理</h1>
    </div>
    <div class="top-status">
      <a class="status-pill top-link" href="/" rel="noopener" data-i18n="dashboard">控制台</a>
      <button class="lang-toggle" id="langToggle" type="button">EN</button>
      <div class="clock" id="mediaVersion">{{ dashboard_version }}</div>
    </div>
  </header>

  <main class="media-shell">
    <section class="cut-panel media-summary-panel">
      <div class="panel-header">
        <span data-i18n="mediaOverview">媒体概览</span>
        <button class="micro-button" id="mediaRefreshButton" type="button" data-i18n="refresh">刷新</button>
      </div>
      <div class="media-summary-grid" id="mediaSummaryGrid"></div>
    </section>

    <section class="cut-panel media-section">
      <div class="panel-header"><span data-i18n="snapshots">截图</span><strong id="snapshotCountLabel">0</strong></div>
      <div class="media-grid" id="snapshotGrid"></div>
    </section>

    <section class="cut-panel media-section">
      <div class="panel-header"><span data-i18n="videos">录像</span><strong id="videoCountLabel">0</strong></div>
      <div class="media-grid" id="videoGrid"></div>
    </section>
  </main>

  <script>
    const I18N = {
      zh: {
        dashboard: "控制台",
        mediaOverview: "媒体概览",
        refresh: "刷新",
        snapshots: "截图",
        videos: "录像",
        recordRoot: "存储路径",
        recording: "录制中",
        latestSnapshot: "最新截图",
        latestVideo: "最新录像",
        on: "开启",
        off: "关闭",
        noSnapshots: "暂无截图",
        noVideos: "暂无录像",
      },
      en: {
        dashboard: "DASHBOARD",
        mediaOverview: "MEDIA OVERVIEW",
        refresh: "REFRESH",
        snapshots: "SNAPSHOTS",
        videos: "VIDEOS",
        recordRoot: "Record Root",
        recording: "Recording",
        latestSnapshot: "Latest Snapshot",
        latestVideo: "Latest Video",
        on: "ON",
        off: "OFF",
        noSnapshots: "No snapshots yet",
        noVideos: "No videos yet",
      }
    };

    let currentLang = localStorage.getItem("lang") || "zh";

    function t(key) {
      return I18N[currentLang]?.[key] ?? I18N["en"][key] ?? key;
    }

    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (I18N[currentLang]?.[key]) {
          el.textContent = I18N[currentLang][key];
        }
      });
      document.getElementById("langToggle").textContent = currentLang === "zh" ? "EN" : "中";
    }

    function toggleLang() {
      currentLang = currentLang === "zh" ? "en" : "zh";
      localStorage.setItem("lang", currentLang);
      applyI18n();
      refreshMediaPage();
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      return response.json();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function summaryCard(label, value) {
      return `<div class="media-summary-card"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function renderMediaItems(nodeId, items, kind) {
      const node = document.getElementById(nodeId);
      if (!node) return;
      if (!items.length) {
        const emptyText = kind === "snapshots" ? t("noSnapshots") : t("noVideos");
        node.innerHTML = `<div class="media-empty">${escapeHtml(emptyText)}</div>`;
        return;
      }
      node.innerHTML = items.map((item) => {
        const preview = kind === "snapshots"
          ? `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.name)}">`
          : `<video controls preload="metadata" src="${escapeHtml(item.url)}"></video>`;
        return `
          <article class="media-card">
            <a class="media-preview" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
              ${preview}
            </a>
            <div class="media-meta">
              <strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong>
              <span>${escapeHtml(item.modified_at || "--")}</span>
              <span>${escapeHtml(String(item.size_bytes || 0))} bytes</span>
            </div>
          </article>
        `;
      }).join("");
    }

    async function refreshMediaPage() {
      const payload = await fetchJson("/api/detail/media");
      const data = payload.data || {};
      document.getElementById("snapshotCountLabel").textContent = String(data.snapshot_count || 0);
      document.getElementById("videoCountLabel").textContent = String(data.video_count || 0);
      document.getElementById("mediaSummaryGrid").innerHTML = [
        summaryCard(t("recordRoot"), data.record_root || "--"),
        summaryCard(t("recording"), data.active_recording ? t("on") : t("off")),
        summaryCard(t("latestSnapshot"), data.latest_snapshot?.name || "--"),
        summaryCard(t("latestVideo"), data.latest_video?.name || "--"),
      ].join("");
      renderMediaItems("snapshotGrid", data.snapshots || [], "snapshots");
      renderMediaItems("videoGrid", data.videos || [], "videos");
    }

    document.getElementById("mediaRefreshButton")?.addEventListener("click", refreshMediaPage);
    document.getElementById("langToggle")?.addEventListener("click", toggleLang);

    applyI18n();
    refreshMediaPage();
  </script>
</body>
</html>
