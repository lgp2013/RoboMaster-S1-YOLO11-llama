<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboMaster S1 Web Debug</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #0d141b;
      color: #e8eef4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d141b; }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #253241;
      background: #121d27;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: 0; }
    main {
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(480px, 2fr) minmax(360px, 1fr);
      gap: 18px;
    }
    section {
      border: 1px solid #263544;
      background: #101a24;
      border-radius: 8px;
      overflow: hidden;
    }
    section + section { margin-top: 18px; }
    section h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 650;
      border-bottom: 1px solid #263544;
      background: #142131;
      letter-spacing: 0;
    }
    .video-wrap {
      aspect-ratio: 16 / 9;
      background: #05080c;
      display: grid;
      place-items: center;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .panel-body { padding: 14px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button {
      border: 1px solid #395169;
      background: #1b2d3f;
      color: #f3f8fc;
      border-radius: 6px;
      min-width: 82px;
      min-height: 38px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #25445f; }
    button:active { transform: translateY(1px); }
    button.danger { border-color: #744044; background: #3a2024; }
    button.primary { border-color: #3c6c8d; background: #1d4c6c; }
    button.warning { border-color: #806a34; background: #40341a; }
    .gimbal-grid {
      display: grid;
      grid-template-columns: repeat(3, 82px);
      grid-template-rows: repeat(3, 42px);
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    .gimbal-grid button { min-width: 0; width: 82px; height: 42px; padding: 0; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .stop { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
    .recenter { grid-column: 1 / 4; grid-row: 4; width: 262px !important; }
    pre, .status-line {
      background: #091018;
      border: 1px solid #223140;
      border-radius: 6px;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #243442;
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
    }
    th { color: #a9bdce; font-weight: 600; }
    .hint { color: #9eb4c8; font-size: 13px; line-height: 1.55; margin-top: 10px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 4px;
      padding: 2px 8px;
      border: 1px solid #34485a;
      background: #132333;
      font-size: 13px;
    }
    .tag.on { border-color: #3f7d5d; background: #193728; color: #bdf2cf; }
    .tag.off { border-color: #6a3a42; background: #321b22; color: #ffd0d5; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 12px; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RoboMaster S1 Web Debug</h1>
    <div class="toolbar">
      <button class="primary" onclick="startRobot()">启动</button>
      <button class="danger" onclick="stopRobot()">停止并释放</button>
    </div>
  </header>

  <main>
    <section>
      <h2>视频预览 / YOLO 检测</h2>
      <div class="video-wrap">
        <img id="video" alt="video preview">
      </div>
    </section>

    <div>
      <section>
        <h2>人物锁定与跟随</h2>
        <div class="panel-body">
          <div class="toolbar">
            <button class="primary" onclick="lockPerson(true)">锁定并跟随</button>
            <button onclick="setAutoFollow(true)">继续跟随</button>
            <button class="warning" onclick="setAutoFollow(false)">暂停跟随</button>
            <button class="danger" onclick="unlockPerson()">解锁停止</button>
          </div>
          <div class="hint">
            锁定时会保存当前画面和人物裁剪图。自动跟随仍采用低速安全策略：只使用低速底盘前后移动和柔和云台微调，用目标框面积近似保持 1-2 米距离。
          </div>
          <pre id="target">等待锁定目标</pre>
        </div>
      </section>

      <section>
        <h2>云台控制</h2>
        <div class="panel-body">
          <div class="gimbal-grid">
            <button class="up" onpointerdown="pressGimbal(event, 'up')" onpointerup="releaseGimbal(event)" onpointercancel="releaseGimbal(event)" onpointerleave="releaseGimbal(event)">上</button>
            <button class="left" onpointerdown="pressGimbal(event, 'left')" onpointerup="releaseGimbal(event)" onpointercancel="releaseGimbal(event)" onpointerleave="releaseGimbal(event)">左</button>
            <button class="stop danger" onclick="gimbal('stop')">停</button>
            <button class="right" onpointerdown="pressGimbal(event, 'right')" onpointerup="releaseGimbal(event)" onpointercancel="releaseGimbal(event)" onpointerleave="releaseGimbal(event)">右</button>
            <button class="down" onpointerdown="pressGimbal(event, 'down')" onpointerup="releaseGimbal(event)" onpointercancel="releaseGimbal(event)" onpointerleave="releaseGimbal(event)">下</button>
            <button class="recenter" onclick="gimbal('recenter')">云台回中</button>
          </div>
          <div class="hint">
            手动云台按钮已降低到更柔和的半速控制，适合近距离调试；需要快速避让时请优先点击停止或释放连接。
          </div>
        </div>
      </section>

      <section>
        <h2>状态</h2>
        <div class="panel-body">
          <div id="status" class="status-line">等待启动</div>
        </div>
      </section>

      <section>
        <h2>识别结果</h2>
        <div class="panel-body">
          <table>
            <thead>
              <tr>
                <th>类别</th>
                <th>置信度</th>
                <th>中心点</th>
                <th>面积占比</th>
                <th>目标分</th>
              </tr>
            </thead>
            <tbody id="detections"></tbody>
          </table>
          <pre id="raw"></pre>
        </div>
      </section>
    </div>
  </main>

  <script>
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const targetBox = document.getElementById("target");
    const detectionsBody = document.getElementById("detections");
    const rawBox = document.getElementById("raw");

    async function postJson(url, body = {}) {
      const res = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || res.statusText);
      }
      return data;
    }

    async function startRobot() {
      try {
        await postJson("/api/start");
        video.src = "/video_feed?t=" + Date.now();
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "启动失败: " + err.message;
      }
    }

    async function stopRobot() {
      try {
        await postJson("/api/stop");
        video.removeAttribute("src");
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "停止失败: " + err.message;
      }
    }

    async function gimbal(direction) {
      try {
        await postJson("/api/gimbal", {direction});
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "云台控制失败: " + err.message;
      }
    }

    function pressGimbal(event, direction) {
      event.preventDefault();
      event.currentTarget.setPointerCapture?.(event.pointerId);
      gimbal(direction);
    }

    function releaseGimbal(event) {
      event.preventDefault();
      gimbal("stop");
    }

    async function lockPerson(enableFollow) {
      try {
        await postJson("/api/lock_person", {enable_follow: enableFollow});
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "锁定失败: " + err.message;
      }
    }

    async function unlockPerson() {
      try {
        await postJson("/api/unlock_person");
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "解锁失败: " + err.message;
      }
    }

    async function setAutoFollow(enabled) {
      try {
        await postJson("/api/auto_follow", {enabled});
        await refreshStatus();
      } catch (err) {
        statusBox.textContent = "跟随状态切换失败: " + err.message;
      }
    }

    function renderDetections(items) {
      detectionsBody.innerHTML = "";
      for (const item of items) {
        const tr = document.createElement("tr");
        const mark = item.is_locked_target ? " <span class=\"tag on\">locked</span>" : "";
        tr.innerHTML = `
          <td>${item.class_name}${mark}</td>
          <td>${item.confidence}</td>
          <td>${item.center}</td>
          <td>${item.area_ratio}</td>
          <td>${item.target_score}</td>
        `;
        detectionsBody.appendChild(tr);
      }
      rawBox.textContent = JSON.stringify(items, null, 2);
    }

    function renderTarget(target, targetDetection) {
      const locked = target && target.locked;
      const follow = target && target.auto_follow;
      const lockedTag = locked ? "已锁定" : "未锁定";
      const followTag = follow ? "跟随中" : "未跟随";
      targetBox.textContent =
        `${lockedTag} / ${followTag}\n` +
        `locked_at=${target.locked_at || ""}\n` +
        `match_score=${target.last_match_score}\n` +
        `last_seen_age_seconds=${target.last_seen_age_seconds}\n` +
        `crop_path=${target.crop_path || ""}\n` +
        `target_detection=${JSON.stringify(targetDetection || null, null, 2)}`;
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        const s = data.status || {};
        statusBox.textContent =
          `robot=${s.robot_connected} video=${s.video_running} yolo=${s.yolo_loaded}\n` +
          `last_action=${s.last_action}\n` +
          `last_error=${s.last_error || ""}`;
        renderTarget(data.target || {}, data.target_detection);
        renderDetections(data.detections || []);
      } catch (err) {
        statusBox.textContent = "状态刷新失败: " + err.message;
      }
    }

    setInterval(refreshStatus, 1000);
    refreshStatus();
  </script>
</body>
</html>
